<!-- Live File Preview Modal Component -->
<div id="previewModal" class="modal" style="display:none;">
  <div class="modal-content preview-modal-content">
    <div class="modal-header">
      <div>
        <h3 id="previewTitle" style="margin:0; font-size:17px; color:#111827;">File Preview</h3>
        <div id="previewBadges" style="margin-top:4px; display:flex; gap:6px;"></div>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <div class="preview-nav">
          <button type="button" class="preview-nav-btn" onclick="navigatePreview(-1)" title="Previous File">&larr; Prev</button>
          <button type="button" class="preview-nav-btn" onclick="navigatePreview(1)" title="Next File">Next &rarr;</button>
        </div>
        <button type="button" class="close-btn" onclick="closePreviewModal()">&times;</button>
      </div>
    </div>

    <div class="preview-body" id="previewBody">
      <div style="color:#64748b;">Loading file preview...</div>
    </div>

    <div id="previewMetadataCard" style="margin-top:14px; border-top:1px solid #e5e7eb; padding-top:10px;">
      <!-- Metadata table populated dynamically via JavaScript -->
    </div>

    <div style="margin-top:16px; display:flex; justify-content:space-between; align-items:center; border-top:1px solid #e5e7eb; padding-top:12px;">
      <div style="display:flex; gap:8px;">
        <a id="previewDownloadLink" href="#" class="btn" style="background:#16a34a;" download>⬇️ Download File</a>
        <a id="previewHexLink" href="#" class="btn" style="background:#2563eb;">🔍 Inspect in Hex Viewer</a>
      </div>
      <button type="button" class="btn btn-gray" onclick="closePreviewModal()">Close</button>
    </div>
  </div>
</div>
